# Настройка генератора базы.
#
# По умолчанию drift пишет схему на диалекте SQLite: там, например, нет
# отдельного типа «да/нет», и логические колонки хранятся числами 0 и 1
# с проверкой `CHECK (x IN (0, 1))`.
#
# PostgreSQL такую проверку не принимает: у него есть настоящий boolean,
# и сравнивать его с числом он отказывается — именно на этом падал
# первый запуск сервера на PostgreSQL.
#
# Перечислив оба диалекта, мы просим генератор сделать код, который
# подстраивается под ту базу, которую ему дали.
targets:
  $default:
    builders:
      drift_dev:
        options:
          sql:
            dialects:
              - sqlite
              - postgres
