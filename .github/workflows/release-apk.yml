# Сборка приложения для Android и выкладывание файла .apk,
# который можно скачать на телефон и установить.
#
# Зачем это здесь, а не на твоём ноутбуке: чтобы собрать APK, нужен
# Android SDK — несколько гигабайт инструментов. У GitHub они уже
# установлены на его машинах. Значит, ставить ничего не надо: пушишь код —
# GitHub сам собирает и кладёт готовый файл в раздел Releases.
#
# Где скачивать готовый файл:
#   https://github.com/kiray228/fastwork/releases/latest

name: Собрать APK для Android

on:
  push:
    branches: [main]
  # И по кнопке вручную, во вкладке Actions.
  workflow_dispatch:

# Право создавать релизы и прикладывать к ним файлы.
permissions:
  contents: write

# Собираем только последний пуш: если их несколько подряд,
# нет смысла выкладывать версию, которую уже успели заменить.
concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    name: Собрать и выложить
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Java
        # Android собирается сборщиком Gradle, а он работает на Java.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Flutter
        uses: subosito/flutter-action@v2
        with:
          # Та же версия, что и у сборки сайта: пусть обе сборки
          # получаются из одного и того же инструмента.
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Скачать зависимости
        run: flutter pub get

      - name: Проверить, что ничего не сломано
        run: flutter test

      - name: Собрать APK под каждый процессор
        # --split-per-abi делает не один файл, а три — по одному на тип
        # процессора. Каждый весит около 20 МБ вместо 60, потому что внутри
        # лежит машинный код только для «своего» процессора.
        #
        # Зачем: универсальный файл на 60 МБ телефон качает и распаковывает
        # заметно дольше, и установка выглядит зависшей.
        #
        # API_URL вшивается в сборку — именно отсюда приложение на телефоне
        # берёт смены и аккаунты. Без него оно полезло бы в локальную базу
        # на самом телефоне и не увидело бы ни одной чужой смены.
        #
        # build-name/build-number — версия приложения. Номер запуска
        # растёт сам, поэтому каждая сборка получает свой номер, и Android
        # понимает, какая новее, когда ставишь обновление поверх старой.
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=API_URL=https://fastwork-server.onrender.com
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Собрать универсальный APK
        # Запасной вариант: подходит любому телефону, но тяжёлый.
        # Нужен на случай, если непонятно, какой процессор в телефоне.
        run: >
          flutter build apk --release
          --dart-define=API_URL=https://fastwork-server.onrender.com
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Дать файлам понятные имена
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          V=1.0.${{ github.run_number }}
          cp app-arm64-v8a-release.apk   "$GITHUB_WORKSPACE/dist/fastwork-$V-arm64.apk"
          cp app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/dist/fastwork-$V-arm32.apk"
          cp app-release.apk             "$GITHUB_WORKSPACE/dist/fastwork-$V-universal.apk"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: fastwork 1.0.${{ github.run_number }}
          files: dist/*.apk
          body: |
            Приложение для Android.

            **Какой файл скачивать**

            | Файл | Кому |
            | --- | --- |
            | `fastwork-1.0.${{ github.run_number }}-arm64.apk` | почти всем — любой телефон новее 2016 года |
            | `fastwork-1.0.${{ github.run_number }}-arm32.apk` | старым и очень дешёвым телефонам |
            | `fastwork-1.0.${{ github.run_number }}-universal.apk` | если первые два не встали |

            Бери **arm64**. Он втрое меньше универсального и ставится быстрее.

            **Как поставить на телефон**
            1. Скачай файл `.apk` ниже — прямо с телефона.
            2. Открой его через «Файлы» → «Загрузки», а не из уведомления
               браузера: так видно, что файл скачался целиком.
            3. Android спросит разрешение ставить приложения из этого
               источника — разреши.

            **Если установка подвисла надолго** — это Play Защита проверяет
            незнакомый файл на серверах Google. Play Маркет → аватар →
            «Play Защита» → шестерёнка → выключить «Сканировать приложения».
            После установки можно включить обратно.

            Если ставишь поверх старой версии и Android ругается на подпись —
            удали старую и поставь заново. Ничего не потеряется: аккаунт и
            смены хранятся на сервере, а не в телефоне.

            Приложение работает с сервером
            https://fastwork-server.onrender.com — аккаунт и смены те же,
            что и на сайте https://kiray228.github.io/fastwork/

            Собрано из коммита ${{ github.sha }}.
