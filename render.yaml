# Настройки для хостинга Render.
#
# Он прочитает этот файл сам, когда подключишь репозиторий, — руками
# ничего вбивать не придётся.
#
# Условия бесплатных тарифов меняются, так что перед запуском посмотри
# актуальные на сайте хостинга. Два места, где обычно кроется подвох:
#   1) бесплатный сервис засыпает без обращений — первый запрос после
#      паузы идёт около минуты;
#   2) без постоянного диска база сбрасывается при перезапуске.
services:
  - type: web
    name: fastwork-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Адрес, который хостинг дёргает, чтобы понять, жив ли сервер.
    healthCheckPath: /api/health
    envVars:
      # PORT хостинг задаёт сам — в коде он не записан, сервер берёт его
      # из окружения. Ровно ради этого.
      #
      # DATABASE_URL подставляется из базы, описанной ниже. Сервер видит
      # её и выбирает PostgreSQL вместо файла — сам, без правок в коде.
      - key: DATABASE_URL
        fromDatabase:
          name: fastwork-db
          property: connectionString
      # Служебный ключ: с ним можно записать новый МРП, когда примут
      # бюджет (см. docs/12-pravila-i-mrp.md). generateValue — хостинг
      # сам придумает случайную строку; посмотреть её можно в настройках
      # сервиса. В репозиторий ключ не попадает.
      - key: ADMIN_KEY
        generateValue: true
      # Деньги. Пока ключей нет, оплата картой и через Kaspi работает в
      # тестовом режиме. Когда будут договоры, впишите ключи в настройках
      # сервиса на Render (Environment) — sync: false значит «значение
      # задаётся там, а не в этом файле». Подробно — docs/13-oplata.md.
      - key: IOKA_API_KEY
        sync: false
      - key: IOKA_API_URL
        sync: false
      - key: IOKA_WEBHOOK_SECRET
        sync: false
      - key: APIPAY_API_KEY
        sync: false
      - key: APIPAY_WEBHOOK_SECRET
        sync: false

# Отдельная база. Она и есть причина всей затеи: файл на диске сервиса
# пропадает при каждом перезапуске, а это — самостоятельная служба со
# своим хранилищем.
databases:
  - name: fastwork-db
    plan: free
